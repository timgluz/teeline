name: build-api

"on":
  push:
    branches: [master]
    paths:
      - 'teeline-api/**'
      - 'Taskfile.yml'
      - 'src/**'
      - '.github/workflows/build-api.yml'
  pull_request:
    branches: [master]
    paths:
      - 'teeline-api/**'
      - 'Taskfile.yml'
      - 'src/**'
      - '.github/workflows/build-api.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-api:
    # hurl's prebuilt Linux binary links libxml2.so.2; Ubuntu 26.04 ships
    # libxml2-16 (libxml2.so.16), so keep this job on the 24.04 image.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: cargo build -p teeline-api --verbose
      - name: Run tests
        run: cargo test -p teeline-api --verbose
      - name: Install mise tools (hurl)
        uses: jdx/mise-action@v5.2.8
      - name: Install hurl runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2
      - name: Run hurl e2e tests (teeline-api)
        run: task test:e2e:api
      - name: Run hurl e2e auth tests (teeline-api)
        run: task test:e2e:auth
      - name: Clippy
        run: cargo clippy -p teeline-api -- -D warnings
