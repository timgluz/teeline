name: deploy-web

on:
  push:
    branches: [master]
    paths: ['teeline-web/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: teeline-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: teeline-web/package-lock.json

      - name: Download WASM component from latest release
        run: |
          mkdir -p ../teeline-wasm/js-bindings
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'teeline-solver.wasm' --output ../teeline-wasm/teeline-solver.wasm "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile WASM to JS bindings (jco)
        run: npx --yes @bytecodealliance/jco@1.20.0 transpile ../teeline-wasm/teeline-solver.wasm --name teeline_wasm -o ../teeline-wasm/js-bindings

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Same as teeline-web.yml: astro 7.2+ builds OOM past the default
          # ~4 GB Node heap on the runner.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Apply D1 migrations
        # Applies teeline-web/migrations/* to the remote teeline-auth D1 DB
        # BEFORE deploy, so the deployed Functions always see the schema they
        # expect. Idempotent (d1_migrations table tracks applied migrations);
        # no-op when nothing new.
        run: npx wrangler d1 migrations apply teeline-auth --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
