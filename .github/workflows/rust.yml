name: Rust

"on":
  push:
    branches: [master]
    paths-ignore:
      - 'teeline-web/**'
      - 'teeline-api/**'
      - 'teeline-qt/**'
      - 'teeline-wasm/**'
      - 'docs/algorithms/**'
      - 'openspec/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'constitution.md'
      - '.claude/**'
      - '.agents/**'
      - 'graphify-out/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'teeline-web/**'
      - 'teeline-api/**'
      - 'teeline-qt/**'
      - 'teeline-wasm/**'
      - 'docs/algorithms/**'
      - 'openspec/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'constitution.md'
      - '.claude/**'
      - '.agents/**'
      - 'graphify-out/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: cargo build -p teeline -p teeline-cli --verbose
      - name: Run tests
        run: cargo test -p teeline -p teeline-cli --verbose
      - name: Run e2e tests (BATS)
        run: ./tests/bats/bin/bats tests/e2e/
      - name: Clippy
        run: cargo clippy -p teeline -p teeline-cli -- -D warnings
