name: teeline-web

"on":
  push:
    branches: [master]
    paths:
      - 'teeline-web/**'
      - '.github/workflows/teeline-web.yml'
  pull_request:
    branches: [master]
    paths:
      - 'teeline-web/**'
      - '.github/workflows/teeline-web.yml'

defaults:
  run:
    working-directory: teeline-web

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: teeline-web/package-lock.json

      - name: Install Rust toolchain + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install cargo-component
        run: cargo install cargo-component --locked

      - name: Build WASM component
        working-directory: teeline-wasm
        run: cargo component build --target wasm32-wasip1

      - name: Transpile WASM to JS bindings (jco)
        working-directory: teeline-web
        run: npx --yes @bytecodealliance/jco@1.20.0 transpile ../teeline-wasm/target/wasm32-wasip1/debug/teeline_wasm.wasm --name teeline_wasm -o ../teeline-wasm/js-bindings

      - name: Install dependencies
        run: npm ci

      - name: Build gate (Pages Functions bundle)
        # Compiles teeline-web/functions/* (WebAuthn auth) to catch bundler /
        # SimpleWebAuthn edge-runtime issues early. Local build only — no
        # Cloudflare auth required.
        run: npx wrangler pages functions build --outdir /tmp/teeline-fn-build

      - name: Lint (tsc)
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:check
        env:
          # astro 7.2+ static builds exceed the runner's default Node heap
          # (~4 GB) and abort with "JavaScript heap out of memory" (exit 134).
          NODE_OPTIONS: --max-old-space-size=6144
