name: web-e2e

# Two browser jobs, split by what they need to run.
#
# `e2e` is the WebAuthn auth service (register → mint → verify → revoke) against
# the local Pages stack with a virtual authenticator: wrangler pages dev + local
# D1, its own config, no Cloudflare auth and no Rust build.
#
# `e2e-web` is every other spec — the explainers, the benchmark sections, the
# landing chart, the problem pages — against `astro dev`. Until it existed, a
# green `e2e` check meant "the auth flows still work", not "the site still
# works", and the specs it was not running had rotted (webmcp still asserted
# forms that had moved off the home page).

permissions:
  # Both jobs only read the repo: the auth job runs against its local Pages stack and D1, the web
  # job downloads a release asset. Scoped rather than left to the repository default.
  contents: read

# The web job downloads a component, transpiles it and boots a dev server, so a superseded push
# should not keep a runner busy.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

"on":
  push:
    branches: [master]
    paths:
      - 'teeline-web/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches: [master]
    paths:
      - 'teeline-web/**'
      - '.github/workflows/web-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: teeline-web/package-lock.json

      - name: Install dependencies
        working-directory: teeline-web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: teeline-web
        run: npx playwright install chromium

      - name: Run auth e2e
        working-directory: teeline-web
        run: npm run test:e2e:auth

  # The rest of the suite. Splitting rather than extending the job above keeps the auth stack (and
  # its three-minute wrangler startup) out of the way of specs that only need `astro dev`, and
  # leaves the existing check's name and meaning alone.
  e2e-web:
    runs-on: ubuntu-latest
    # A hung dev server or Playwright run would otherwise sit on the runner for the 6-hour default.
    timeout-minutes: 20

    defaults:
      run:
        working-directory: teeline-web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: teeline-web/package-lock.json

      # The component's core .wasm is git-ignored and built by the release, so a fresh checkout has
      # none — without it the solve page never reaches `.status-dot--ready` and the WebMCP tool
      # tests time out. Same source and same transpile step as deploy-web.yml, so this exercises the
      # artifact production actually serves.
      #
      # It is the *released* component, not this branch's: a PR touching the Rust solver or the WIT
      # surface is tested against the last release, and the jobs that cover those changes are the
      # Rust ones. Testing a freshly built component here would mean cargo-component and jco on this
      # runner for a suite that exists to catch page regressions. A release without the asset fails
      # here loudly, which is the intended outcome rather than a silent skip.
      - name: Download WASM component from latest release
        run: |
          mkdir -p ../teeline-wasm/js-bindings
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'teeline-solver.wasm' --output ../teeline-wasm/teeline-solver.wasm "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile WASM to JS bindings (jco)
        run: npx --yes @bytecodealliance/jco@1.20.0 transpile ../teeline-wasm/teeline-solver.wasm --name teeline_wasm -o ../teeline-wasm/js-bindings

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # One project, not both: `chrome` selects the runner's own Google Chrome via `channel`, and
      # only Chromium is installed here. The specs are browser-agnostic (WebMCP's agent event is
      # simulated), and a developer still runs both with `npm run test:e2e`.
      - name: Run the web e2e suite
        run: npx playwright test --project=chromium

      # Retries are on in CI, so a failure that only reproduces there needs its trace and error
      # context to be diagnosable after the runner is gone.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: |
            teeline-web/playwright-report
            teeline-web/test-results
          retention-days: 7
