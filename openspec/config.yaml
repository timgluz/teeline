schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Teeline's governing principles live in `constitution.md` at the repository root.
  Every proposal, spec delta, design and task MUST comply with it. If a change would
  violate a principle, amend the constitution first (see its Governance section).
  Dated decisions live in `docs/adr/`; pending work is listed in `docs/backlog.md`.

  In particular: correctness before performance; TSPLIB known optima are the ground
  truth; one solver dispatch path (`Solvers` -> `solve_with_context`); solver logic lives
  only in the root `teeline` crate; teeline-api follows lean routes, business logic in
  services behind traits, and data access only through repositories/ports.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
