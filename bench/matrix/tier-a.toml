# Tier A — capability-tiered benchmark matrix.
#
# Read by scripts/bench-matrix.sh, which turns it into bench/runs/tier-a.jsonl. The
# published contract is docs/benchmarks/schema.md.
#
# Coverage is capability-tiered rather than exhaustive. Exact solvers are exponential, so
# they are measured only on instances small enough to finish; a solver that cannot produce
# a result on an instance is not measured on it at all, rather than burning its budget to
# record a timeout that was never in doubt.

tier = "a"

# Runs per (solver, instance, config) cell. Five, so a non-deterministic solver gets a
# spread rather than a single number.
runs = 5

# Per-family wall-clock budget in seconds. A result is only comparable within its family, and a
# gap figure without its budget is uninterpretable — these are published alongside the numbers
# (see `bench/budgets.json`, which must agree with this table, and which a test enforces).
#
# Every family named in [coverage] needs an entry: there is deliberately no fallback, because a
# family measured under some default while the published budgets state another number would put
# an allowance on the page that the data was not taken under.
[budgets]
exact = 60
local = 300
meta = 300
constructive = 30
utility = 60

# Which instance groups each solver family is measured on. `upto24` is the small group an
# exponential solver can finish; `all` spans every distance type and size.
[coverage]
exact = ["upto24"]
constructive = ["upto24", "all"]
local = ["upto24", "all"]
meta = ["upto24", "all"]
utility = ["upto24", "all"]

# Instances, grouped by what they are evidence for. Every entry is verified to parse.
# `gr120` (LOWER_DIAG_ROW) stands in for `si175`: the substitution was made while si175's
# UPPER_DIAG_ROW format was unsupported, and it stays now that si175 parses, because changing an
# instance would break comparability with the published runs.
#
# The distance types are covered as: GEO (burma14, ulysses16, ulysses22), EXPLICIT (gr17,
# gr120), ATT (att48), CEIL_2D (dsj1000), EUC_2D (berlin52, eil76, kroA100, ch150, a280).
[instances]
# Small enough for an exponential solver within its budget.
burma14 = "upto24"   # GEO, 14
gr17 = "upto24"      # EXPLICIT, 17
ulysses16 = "upto24" # GEO, 16
# The wider corpus.
ulysses22 = "all" # GEO, 22
att48 = "all"     # ATT, 48
berlin52 = "all"  # EUC_2D, 52
eil76 = "all"     # EUC_2D, 76
kroA100 = "all"   # EUC_2D, 100
gr120 = "all"     # EXPLICIT, 120
ch150 = "all"     # EUC_2D, 150
a280 = "all"      # EUC_2D, 280
dsj1000 = "all"   # CEIL_2D, 1000

# Configs are named sets of extra CLI arguments. `solvers` and `instances` restrict where a config
# applies; `exclude_solvers` removes named solvers without restricting the others.
#
# `budget` is the budget-limited run decision 1 asks for: the solver as configured, with the
# family's wall-clock budget as the only limit. It carries no arguments because the allowance is
# the timeout, not a flag.
#
# The converged half of decision 1 is deliberately absent. `--stagnation_epochs` is honoured by ten
# solvers but five local-search solvers ignore it, and `som`/`fourier` reject the unbounded
# `--epochs 0` it needs — so a "to convergence" column would be missing for 7 of 22 solvers, and a
# column that is absent for a third of the table is worse than one that is not published yet.
[configs.budget]
exclude_solvers = ["insertion"]

# Insertion has one explicitly named config per strategy.
[configs.nearest]
solvers = ["insertion"]
args = ["--strategy", "nearest"]

[configs.farthest]
solvers = ["insertion"]
args = ["--strategy", "farthest"]

[configs.cheapest]
solvers = ["insertion"]
args = ["--strategy", "cheapest"]

# `branch_bound` is exact by default and ignores `--n_nearest`, so it needs no separate
# config: the `budget` run is already the exact run.
