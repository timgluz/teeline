[workspace]

[package]
name = "teeline-qt"
version = "0.2.0"
edition = "2024"
authors = ["Timo Sulg <timgluz@gmail.com>"]
repository = "https://github.com/timgluz/teeline"
license = "LGPL-3.0-or-later"
description = "Qt 6 GUI for the Teeline TSP solver"

[[bin]]
name = "teeline-qt"
path = "src/main.rs"

[package.metadata.dist]
dist = false # requires Qt runtime; not a standalone distributable binary

[dependencies]
# Pinned to a backport of upstream 88105239b2: mutable dispatch used &mut
# proxy receivers, so a signal emitted from a mutable slot re-entered the same
# proxy through shared references and could abort on "Failed to borrow for
# read_property()". Switch back to upstream once the 0.3+ API migration is done.
qtbridge = { git = "https://github.com/timgluz/qtbridge-rust", rev = "8c844588cdf40e2ef3c8f621f40de1f65dc88cef" }
teeline = { path = ".." }
serde_json = "1"
