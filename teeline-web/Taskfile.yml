version: '3'

tasks:
  db:migrate:local:
    desc: "Apply D1 migrations to the local dev database (wrangler pages dev uses local D1; migrations are only applied to the remote DB on deploy)"
    cmds:
      - npx wrangler d1 migrations apply teeline-auth --local

  dev:
    desc: "Start Astro dev server at http://localhost:4321 (auth needs wrangler pages dev on :8788 — astro proxies /api/auth — plus SESSION_SECRET + ALLOWED_ORIGINS=http://localhost:8788 via .dev.vars and a migrated local D1: run db:migrate:local once)"
    cmds:
      - npm run dev

  serve:
    desc: Build, then start Astro dev server (matches `task api:serve` naming)
    deps:
      - build
    cmds:
      - task: dev

  # web:serve runs astro dev in the foreground, so there's no PID file to read
  # (unlike api:stop). Stop by killing whatever holds the dev port, then sweep
  # any stray astro process as a fallback.
  stop:
    desc: Stop a running Astro dev/preview server (default port 4321; override with PORT=<n>)
    vars:
      PORT: '{{.PORT | default "4321"}}'
    cmds:
      - 'kill $(lsof -ti:{{.PORT}}) 2>/dev/null || true'
      - 'pkill -f "astro/bin/astro" 2>/dev/null || true'

  build:
    desc: Type-check and build production bundle to dist/
    cmds:
      - npm run build

  preview:
    desc: Serve the production dist/ locally (after build)
    cmds:
      - npm run preview

  test:
    desc: Run vitest test suite (node environment)
    cmds:
      - npm test

  test:watch:
    desc: Run vitest in watch mode
    cmds:
      - npx vitest

  test:e2e:
    desc: Run Playwright e2e tests
    cmds:
      - npm run test:e2e

  lint:
    desc: Type-check with astro check + tsc (no emit)
    cmds:
      - npx astro check
      - npx tsc --noEmit

  deploy:preview:
    desc: Build and deploy to CF Pages preview (current branch)
    cmds:
      - npm run build
      - npx wrangler pages deploy dist/

  deploy:release:
    desc: Build and deploy to CF Pages production (master branch)
    cmds:
      - npm run build
      - npx wrangler pages deploy dist/ --branch master

  clean:
    desc: Remove dist/ build output
    cmds:
      - rm -rf dist/
