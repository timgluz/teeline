<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Tier A median gap before and after the swarm-solver rewrite</title>
  <desc id="fig-desc">PSO drops from 150.35% to 6.88%, FPA from 253.94% to 4.07%, and GSA from 190.52% to 2.59% median gap on the 12-map Tier A benchmark.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="419" rx="12" fill="#141416" stroke="#232327"/>

  <text x="24" y="38" fill="#f5f5f6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600">Tier A median gap, before → after</text>
  <text x="24" y="60" fill="#8a8a92" font-family="Inter, system-ui, sans-serif" font-size="12">12 TSPLIB maps · 5 runs each · lower is better</text>

  <circle cx="638" cy="42" r="5" fill="#f87171"/>
  <text x="650" y="46" fill="#8a8a92" font-family="Inter, system-ui, sans-serif" font-size="12">before</text>
  <circle cx="714" cy="42" r="5" fill="#22d3a5"/>
  <text x="726" y="46" fill="#8a8a92" font-family="Inter, system-ui, sans-serif" font-size="12">after</text>

  <!-- grid -->
  <g stroke="#232327" stroke-width="1">
    <line x1="120" y1="90" x2="120" y2="344"/>
    <line x1="253.3" y1="90" x2="253.3" y2="344"/>
    <line x1="386.7" y1="90" x2="386.7" y2="344"/>
    <line x1="520" y1="90" x2="520" y2="344"/>
    <line x1="653.3" y1="90" x2="653.3" y2="344"/>
    <line x1="786.7" y1="90" x2="786.7" y2="344"/>
    <line x1="120" y1="344" x2="840" y2="344"/>
  </g>

  <!-- FPA: 253.94 -> 4.07 -->
  <line x1="797.2" y1="140" x2="120.9" y2="140" stroke="#6366f1" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="797.2" cy="140" r="6" fill="#f87171"/>
  <circle cx="130.9" cy="140" r="6" fill="#22d3a5"/>
  <text x="24" y="145" fill="#f5f5f6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">FPA</text>
  <text x="797.2" y="122" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">253.9%</text>
  <text x="146.9" y="145" fill="#22d3a5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">4.1%</text>

  <!-- GSA: 190.52 -> 2.59 -->
  <line x1="628.1" y1="220" x2="116.9" y2="220" stroke="#6366f1" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="628.1" cy="220" r="6" fill="#f87171"/>
  <circle cx="126.9" cy="220" r="6" fill="#22d3a5"/>
  <text x="24" y="225" fill="#f5f5f6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">GSA</text>
  <text x="628.1" y="202" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">190.5%</text>
  <text x="142.9" y="225" fill="#22d3a5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">2.6%</text>

  <!-- PSO: 150.35 -> 6.88 -->
  <line x1="520.9" y1="300" x2="128.3" y2="300" stroke="#6366f1" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="520.9" cy="300" r="6" fill="#f87171"/>
  <circle cx="138.3" cy="300" r="6" fill="#22d3a5"/>
  <text x="24" y="305" fill="#f5f5f6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">PSO</text>
  <text x="520.9" y="282" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">150.4%</text>
  <text x="154.3" y="305" fill="#22d3a5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">6.9%</text>

  <!-- x-axis labels -->
  <g fill="#8a8a92" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <text x="120" y="368">0%</text>
    <text x="253.3" y="368">50%</text>
    <text x="386.7" y="368">100%</text>
    <text x="520" y="368">150%</text>
    <text x="653.3" y="368">200%</text>
    <text x="786.7" y="368">250%</text>
  </g>
</svg>
